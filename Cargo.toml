[package]
name = "homelab-cert"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
time = "0.3"
rsa = "0.9"
rand = "0.8"
ureq = { version = "2", default-features = false, features = ["tls"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
zip = { version = "0.6", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
