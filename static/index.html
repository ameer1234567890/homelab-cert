<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>homelab-cert</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232f3fbf'/><path d='M10 16.5l4 4 8-9' stroke='white' stroke-width='3' fill='none'/></svg>">
<style>
:root{--bg:#eceff3;--surface:#fff;--ink:#151a22;--mute:#5b6573;--line:#d5dae2;--accent:#2f3fbf;--on-accent:#fff;--ok:#1f7a4d;--warn:#a85f00;--bad:#b3261e;--track:#e3e7ee;color-scheme:light}
:root[data-theme=dark]{--bg:#0e1117;--surface:#161a22;--ink:#e7eaf0;--mute:#98a2b2;--line:#2a303b;--accent:#8c9bff;--on-accent:#0e1117;--ok:#4cc38a;--warn:#e0a03a;--bad:#ff7b72;--track:#262c37;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:26px;height:26px}
main{max-width:980px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:20px}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
h2{margin:0 0 4px;font-size:1.05rem}
.hint{color:var(--mute);font-size:.88rem;margin:0 0 14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:62px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.full{grid-column:1/-1}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-block}
button,.btn{transition:transform .06s,box-shadow .06s,filter .1s,border-color .1s;user-select:none}
button:hover,.btn:hover{border-color:var(--accent)}
button:active:not(:disabled),.btn:active,details[open]>summary.btn{transform:translateY(1px) scale(.98);box-shadow:inset 0 2px 5px #00000040;filter:brightness(.9);border-color:var(--accent)}
.primary:active:not(:disabled){filter:brightness(.85)}
button:disabled{opacity:.5;cursor:not-allowed}
summary.btn{cursor:pointer}
.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.danger{color:var(--bad)}
.small{padding:5px 10px;font-size:.85rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(150px,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.sans{color:var(--mute);overflow-wrap:anywhere}
.gauge{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-bottom:5px}
.gauge i{display:block;height:100%;border-radius:4px;transition:width .4s}
.ok i{background:var(--ok)}.warn i{background:var(--warn)}.bad i{background:var(--bad)}
.life{font-size:.85rem;color:var(--mute)}
.ok .life b{color:var(--ok)}.warn .life b{color:var(--warn)}.bad .life b{color:var(--bad)}
details{position:relative;display:inline-block}
summary{list-style:none}summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;z-index:3;min-width:150px;box-shadow:0 8px 24px #0004}
.menu a{display:block;padding:7px 10px;border-radius:5px;color:var(--ink);text-decoration:none;font-size:.9rem}
.menu a:hover{background:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 6px 3px 12px;font-size:.9rem}
.chip button{border:0;background:none;padding:0 6px;color:var(--mute);font-size:1rem;line-height:1}
.add{display:flex;gap:8px;max-width:260px}
/* switches */
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--mute);font-size:.9rem;margin:0}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .t{width:38px;height:22px;background:var(--track);border:1px solid var(--line);border-radius:11px;position:relative;transition:background .2s}
.switch .t::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:transform .2s,background .2s}
.switch input:checked+.t{background:var(--accent);border-color:var(--accent)}
.switch input:checked+.t::after{transform:translateX(16px);background:var(--on-accent)}
.switch input:focus-visible+.t{outline:2px solid var(--accent);outline-offset:2px}
.login{max-width:360px;margin:12vh auto 0}
.login form{display:grid;gap:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:9}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem}
#toast .e{background:var(--bad);color:#fff}
.empty{color:var(--mute);padding:18px 0 4px}
@media(max-width:700px){.row{grid-template-columns:1fr}header{padding:12px 16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><path d="M10 16.5l4 4 8-9" stroke="var(--on-accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>homelab-cert</div>
  <label class="switch" title="Dark mode"><input type="checkbox" id="dark" aria-label="Dark mode"><span class="t"></span>Dark</label>
  <button class="small" id="out" hidden onclick="logout()">Sign out</button>
</header>
<main id="app"></main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>new Date(t*1000).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
let S=null, ths=[];

// theme
const root=document.documentElement, saved=localStorage.getItem("theme");
const setTheme=d=>{root.dataset.theme=d?"dark":"light";$("#dark").checked=d;localStorage.setItem("theme",d?"dark":"light")};
setTheme(saved?saved==="dark":matchMedia("(prefers-color-scheme:dark)").matches);
$("#dark").onchange=e=>setTheme(e.target.checked);

function toast(m,bad){const d=document.createElement("div");d.textContent=m;if(bad)d.className="e";$("#toast").append(d);setTimeout(()=>d.remove(),4000)}
async function api(p,method="GET",body){
  const r=await fetch("/api/"+p,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&p!=="login"){showLogin();throw new Error("Signed out")}
  if(!r.ok)throw new Error(d.error||"Request failed");
  return d;
}
const run=async(fn,ok)=>{document.body.style.cursor="progress";try{await fn();if(ok)toast(ok)}catch(e){toast(e.message,true)}finally{document.body.style.cursor=""}};

function showLogin(){
  $("#out").hidden=true;
  app.innerHTML=`<section class="login"><h2>Sign in</h2><p class="hint">Use the credentials set in your docker compose file.</p>
  <form onsubmit="login(event)"><div><label for="u">Username</label><input id="u" autocomplete="username" required autofocus></div>
  <div><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
  <button class="primary">Sign in</button></form></section>`;
}
const login=e=>{e.preventDefault();run(async()=>{await api("login","POST",{username:$("#u").value,password:$("#p").value});await load()})};
const logout=()=>run(async()=>{await api("logout","POST");showLogin()});

async function load(){S=await api("state");ths=[...S.settings.thresholds];$("#out").hidden=false;render()}

function gauge(c){
  const pct=Math.max(0,Math.min(100,c.days_left/Math.max(c.days,1)*100));
  const cls=c.days_left<=7?"bad":c.days_left<=30?"warn":"ok";
  const txt=c.days_left<0?"<b>Expired</b>":`<b>${c.days_left} days left</b>`;
  return `<div class="${cls}"><div class="gauge"><i style="width:${pct}%"></i></div><div class="life">${txt} &middot; ${c.days_left<0?"ended":"until"} ${fmt(c.not_after)}</div></div>`;
}

function render(){
  const r=S.root, s=S.settings;
  const rootHtml=r?`
    <div class="row" style="border:0;padding:8px 0 0"><div><b>${esc(r.name)}</b><div class="sans">${r.kt==="ec"?"ECDSA P-256":"RSA 4096"} &middot; signs every certificate below</div></div>${gauge(r)}
    <div class="actions" style="margin:0"><a class="btn primary" href="/api/certs/${r.id}/download/cert">Download root certificate</a><a class="btn" href="/api/certs/${r.id}/download/key" onclick="return confirm('The root private key can sign certificates that all your devices will trust.\\n\\nStore it somewhere safe and never share it. Download it?')">Download root key</a><button class="danger" onclick="regen()">Regenerate</button></div></div>
    <p class="hint" style="margin:14px 0 0">Install the root certificate in the trust store of each device that should trust your servers.</p>`:`
    <p class="hint">Create the root certificate once. It signs a certificate for each of your servers.</p>
    <div class="grid"><div><label>Name</label><input id="rn" value="Homelab Root CA"></div>
    <div><label>Valid for (years)</label><input id="ry" type="number" min="1" max="30" value="10"></div>
    <div><label>Key type</label><select id="rk"><option value="ec">ECDSA P-256 (fast, modern)</option><option value="rsa">RSA 4096 (most compatible, slower to create)</option></select></div></div>
    <div class="actions"><button class="primary" onclick="mkRoot()">Create root CA</button></div>`;
  const rows=S.certs.map(c=>`<div class="row"><div><b class="mono">${esc(c.name)}</b><div class="sans mono">${esc(c.sans)}</div></div>${gauge(c)}
    <div class="actions" style="margin:0"><details><summary class="btn small">Download</summary><div class="menu">
      <a href="/api/certs/${c.id}/download/bundle">Bundle (.zip)</a><a href="/api/certs/${c.id}/download/cert">Certificate</a>
      <a href="/api/certs/${c.id}/download/fullchain">Full chain</a><a href="/api/certs/${c.id}/download/key">Private key</a></div></details>
      <button class="small" onclick="renew(${c.id},'${esc(c.name).replace(/'/g,"")}')">Renew</button><button class="small danger" onclick="del(${c.id},'${esc(c.name).replace(/'/g,"")}')">Delete</button></div></div>`).join("");
  app.innerHTML=`
  <section><div class="bar"><h2>Root CA</h2></div>${rootHtml}</section>
  <section><div class="bar"><h2>Certificates</h2><button class="primary small" ${r?"":"disabled"} onclick="$('#nf').hidden=!$('#nf').hidden">New certificate</button></div>
    <p class="hint">One certificate per server, signed by your root CA.</p>
    <div id="nf" hidden style="border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:8px"><div class="grid">
      <div><label>Server name</label><input id="cn" placeholder="nas.home.lan"></div>
      <div><label>Valid for (days)</label><input id="cd" type="number" min="1" max="3650" value="365"></div>
      <div><label>Key type</label><select id="ck"><option value="ec">ECDSA P-256</option><option value="rsa">RSA 2048</option></select></div>
      <div class="full"><label>Extra names and IPs (space or comma separated)</label><textarea id="cs" placeholder="nas 192.168.1.20 *.nas.home.lan"></textarea></div></div>
      <div class="actions"><button class="primary" onclick="mkCert()">Create certificate</button></div></div>
    ${rows||`<p class="empty">${r?"No certificates yet. Create one for your first server.":"Create the root CA first."}</p>`}</section>
  <section><h2>Expiry notifications</h2><p class="hint">Get a message when a certificate (or the root) reaches one of these thresholds, and again when it expires. Checked hourly.</p>
    <label class="switch" style="margin-bottom:14px"><input type="checkbox" id="en" ${s.enabled?"checked":""}><span class="t"></span>Notifications on</label>
    <div class="grid"><div class="full"><label>Webhook URL</label><input id="wh" class="mono" value="${esc(s.webhook_url)}" placeholder="https://api.telegram.org/bot<token>" autocomplete="off"></div>
    <div><label>Telegram chat ID (Telegram only)</label><input id="ch" class="mono" value="${esc(s.chat_id)}" placeholder="123456789"></div></div>
    <p class="hint" style="margin-top:8px">Telegram: paste your bot URL and chat ID. Any other URL receives a JSON POST with <span class="mono">text</span>, <span class="mono">content</span> and <span class="mono">message</span> fields, so Slack and Discord webhooks work.</p>
    <label style="margin-top:12px">Notify when this many days remain</label><div class="chips" id="chips"></div>
    <div class="add"><input id="nt" type="number" min="1" max="3650" placeholder="Days" onkeydown="if(event.key==='Enter')addTh()"><button onclick="addTh()">Add</button></div>
    <div class="actions"><button class="primary" onclick="saveSet()">Save settings</button><button onclick="testHook()">Send test message</button></div></section>`;
  chips();
}
const chips=()=>{$("#chips").innerHTML=ths.length?ths.map(t=>`<span class="chip">${t} days<button aria-label="Remove ${t} days" onclick="rmTh(${t})">&times;</button></span>`).join(""):`<span class="hint">No thresholds. Only expiry will notify.</span>`};
const addTh=()=>{const v=parseInt($("#nt").value);if(!(v>=1&&v<=3650))return toast("Enter 1 to 3650 days",true);if(!ths.includes(v))ths=[...ths,v].sort((a,b)=>b-a);$("#nt").value="";chips()};
const rmTh=t=>{ths=ths.filter(x=>x!==t);chips()};
const form=()=>({webhook_url:$("#wh").value,chat_id:$("#ch").value,thresholds:ths,enabled:$("#en").checked});
const saveSet=()=>run(async()=>{await api("settings","PUT",form());await load()},"Settings saved");
const testHook=()=>run(async()=>{await api("settings","PUT",form());await api("settings/test","POST")},"Test message sent");
const mkRoot=()=>run(async()=>{await api("root","POST",{name:$("#rn").value,years:$("#ry").value,key_type:$("#rk").value});await load()},"Root CA created");
const regen=()=>{if(!confirm(`Regenerate the root CA?\n\nAll ${S.certs.length} certificate(s) are reissued under the new root, and every device must trust the new root certificate.`))return;
  run(async()=>{await api("root","POST",{name:S.root.name,years:Math.round(S.root.days/365),key_type:S.root.kt,confirm:true});await load()},"Root CA regenerated")};
const mkCert=()=>run(async()=>{await api("certs","POST",{name:$("#cn").value,sans:$("#cs").value,days:$("#cd").value,key_type:$("#ck").value});await load()},"Certificate created");
const renew=(id,n)=>{if(!confirm(`Renew the certificate for ${n}?\n\nThis issues a new certificate and a new private key. The old files are replaced here, so download the new ones and install them on your server.`))return;
  run(async()=>{await api(`certs/${id}/renew`,"POST");await load()},"Certificate renewed (new key)")};
const del=(id,n)=>{if(confirm(`Delete the certificate for ${n}?`))run(async()=>{await api(`certs/${id}`,"DELETE");await load()},"Certificate deleted")};

// close download menus on outside click, Escape, or choosing an item
const closeMenus=except=>document.querySelectorAll("details[open]").forEach(d=>{if(d!==except)d.open=false});
document.addEventListener("click",e=>{const d=e.target.closest("details");closeMenus(d);if(d&&e.target.closest(".menu a"))setTimeout(()=>d.open=false,0)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenus()});

load().catch(()=>{});
</script>
</body>
</html>
